name: PRISM Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test-suite:
    name: Backend Test & Static Verification
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio httpx reportlab pymupdf pdfplumber pypdf shapely

      - name: Syntax & Import Health Check
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/services/gfr175_service.py
          python -m py_compile backend/app/services/temp_analysis_service.py

      - name: Run Ephemeral Analysis & GFR-175 Compliance Unit Tests
        working-directory: ./backend
        run: |
          python -m pytest tests/test_temporary_analysis.py app/tests/test_gfr175_compliance.py -v

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript Verification & Lint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

  dataset-and-geo-integrity:
    name: Geolocation & Database Invariant Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install shapely

      - name: Verify 1,981 Projects Geolocation Invariants
        run: |
          python scripts/validate_after_rebuild.py
